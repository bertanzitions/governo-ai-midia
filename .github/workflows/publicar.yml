name: publicar
# Disparado de dois jeitos:
# - pub/<lote>/job.json: pedido enviado pela esteira numa conversa com o Lucas;
# - fila/<post>/publicar: o Lucas clicou em "Publicar" na página de revisão e confirmou o commit no GitHub.
#   O post já estava preparado em fila/<post>/ (imagens revisadas + job.json) pela esteira.
# Publica no Instagram com o segredo IG_TOKEN e grava o resultado em resultados/.
on:
  push:
    branches: [main]
    paths: ["pub/**/job.json", "fila/**/publicar"]
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar pedidos pendentes
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_TOKEN_GERADO_EM: ${{ vars.IG_TOKEN_GERADO_EM }}
          IG_LOCATION_ID: ${{ vars.IG_LOCATION_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 publicar.py
      - name: Gravar resultado e limpar imagens
        run: |
          git config user.name "governo.ai esteira"
          git config user.email "esteira@governo.ai"
          git add -A
          git diff --cached --quiet || git commit -m "resultado da publicação"
          git push
